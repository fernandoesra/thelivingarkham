<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Living Arkham · Grimorio interactivo de Arkham Horror LCG</title>
  <meta name="description" content="El Grimorio de Arkham en versión web interactiva: glosario de reglas bilingüe (ES/EN), buscador y referencias cruzadas de Arkham Horror: El Juego de Cartas.">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 4 61 30 90 30 67 48 76 76 50 59 24 76 33 48 10 30 39 30Z' fill='%23d4af37'/%3E%3C/svg%3E">
  <script>
    /* set theme before paint to avoid a flash of the wrong theme */
    (function(){try{var t=localStorage.getItem('tla-theme');
      if(t!=='light'&&t!=='dark'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}
      document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
  </script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="tla-skip" href="#tla-main">Saltar al contenido</a>
<div id="tla-root" class="tla" data-lang="es">

  <!-- HEADER -->
  <header class="tla-head">
    <button class="tla-burger" id="tla-burger" type="button" aria-label="Abrir menú de secciones" aria-expanded="false" aria-controls="tla-nav">☰</button>
    <a class="tla-brand" id="tla-home" href="#es/intro" title="Inicio">
      <svg class="tla-sigil" viewBox="0 0 100 100" fill="none" aria-hidden="true" focusable="false">
        <path d="M50 4 L61 30 L90 30 L67 48 L76 76 L50 59 L24 76 L33 48 L10 30 L39 30 Z" fill="currentColor" opacity=".92"/>
        <circle cx="50" cy="48" r="9" fill="var(--bg)"/><circle cx="50" cy="48" r="4.4" fill="currentColor"/>
      </svg>
      <span class="tla-titles">
        <span class="tla-title">The Living Arkham <span class="tla-beta">beta</span></span>
        <span class="tla-sub" id="tla-sub">Grimorio interactivo · Arkham Horror LCG</span>
      </span>
    </a>
    <div class="tla-spacer"></div>
    <button class="tla-searchbtn" id="tla-search-open" type="button" aria-haspopup="dialog" aria-label="Buscar en el grimorio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <span class="tla-searchbtn-txt" id="tla-searchbtn-txt">Buscar…</span>
      <kbd aria-hidden="true">/</kbd>
    </button>
    <button class="tla-theme" id="tla-theme" type="button" aria-label="Cambiar a tema claro" title="Tema claro/oscuro">
      <svg class="tla-ico-moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="tla-ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
    </button>
    <div class="tla-lang" role="group" aria-label="Idioma">
      <button type="button" data-l="es" aria-pressed="true">ES</button>
      <button type="button" data-l="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <!-- BODY -->
  <div class="tla-body">
    <nav class="tla-nav" id="tla-nav" aria-label="Secciones del grimorio"></nav>
    <main class="tla-main" id="tla-main" tabindex="-1"></main>
    <aside class="tla-toc" id="tla-toc" aria-label="En esta página"></aside>
  </div>

  <!-- FOOTER -->
  <footer class="tla-foot">
    <span id="tla-foot-src">Basado en <b>El Grimorio de Arkham</b> v1.0 (ES) / v1.1 (EN) · reglas © sus autores · Arkham Horror: LCG ™ Fantasy Flight Games</span>
    <span>The Living Arkham <b>v0.1.0 · beta</b> · <a href="https://rinconmiskatonic.org" target="_blank" rel="noopener">Rincón Miskatonic</a></span>
  </footer>

  <!-- SEARCH OVERLAY -->
  <div class="tla-searchmodal" id="tla-searchmodal" role="dialog" aria-modal="true" aria-label="Buscar en el grimorio" hidden>
    <div class="tla-searchmodal-box">
      <div class="tla-searchmodal-bar" role="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="tla-q" type="search" autocomplete="off" spellcheck="false" role="combobox"
               aria-label="Buscar en el grimorio" aria-controls="tla-results" aria-expanded="false" aria-autocomplete="list"
               placeholder="Buscar reglas, palabras clave, iconos…">
        <button class="tla-searchmodal-cancel" id="tla-search-cancel" type="button">Cancelar</button>
      </div>
      <div class="tla-results" id="tla-results" role="listbox" aria-label="Resultados de búsqueda"></div>
      <div class="tla-searchhint" id="tla-searchhint" aria-hidden="true"><span><kbd>↑</kbd><kbd>↓</kbd> navegar</span><span><kbd>↵</kbd> abrir</span><span><kbd>Esc</kbd> cerrar</span></div>
    </div>
  </div>

  <div class="tla-scrim" id="tla-scrim"></div>
  <div class="tla-lb" id="tla-lb"><button class="tla-lb-close" type="button" aria-label="Cerrar imagen">✕</button><img alt=""></div>
  <div class="tla-sr" id="tla-live" role="status" aria-live="polite"></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
